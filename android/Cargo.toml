[package]
name = "korean-rust-grammar-android"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "APK Android untuk korean-rust-grammar — antarmuka egui, seluruhnya Rust."
license = "MIT"
publish = false

# Di Android crate ini harus cdylib (dimuat Activity native milik eframe).
[lib]
name = "korean_rust_grammar_android"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kg-desktop"
path = "src/bin/desktop.rs"

[dependencies]
# Inti aplikasi: data materi, kuis, romanisasi, progres — tanpa I/O terminal.
korean-rust-grammar = { path = "..", version = "1.0.0" }

eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "android-native-activity",
] }
egui = "0.37"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
android_logger = "0.15"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ---------------------------------------------------------------- Android
[package.metadata.android]
package = "com.rifqilubis.koreanrustgrammar"
apk_name = "korean-rust-grammar"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
# Huruf Korea (NanumGothic) ditanam lewat include_bytes!, jadi tidak ada
# berkas aset yang perlu ikut ke dalam APK.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Korean Rust Grammar"
icon = "@mipmap/ic_launcher"
